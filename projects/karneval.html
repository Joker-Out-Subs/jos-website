<html lang="en">
<head>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>karneval lights!</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: sans-serif;
    background: black;
}

#centerContent {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: white;
    padding: 50px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.35s ease;
}

#centerContent.visible {
    opacity: 1;
}

#centerContent img {
    width: min(95vw, 70vh);
    opacity: 1;
    
}

#accessibilityToggle {
    position: fixed;
    top: 15px;
    right: 15px;
    z-index: 2000;

    color: white;
    font-size: 15px;
    opacity: 0.8;
    cursor: pointer;
    user-select: none;
    text-decoration: underline;
}

#instructionsToggle {
    position: fixed;
    top: 15px;
    left: 15px;
    z-index: 2000;

    color: white;
    font-size: 15px;
    opacity: 0.8;
    cursor: pointer;
    user-select: none;
    text-decoration: underline;
}

#soloZone {
    position: fixed;
    left: 0;
    bottom: 0;
    width: 100%;
    height: 50vh;
    z-index: 500;
    background: transparent;
    transition: outline 0.2s ease;
}

#soloZone.visible {
    outline: 2px dashed rgba(255,255,255,0.5);
}

/* label */
#soloLabel {
    position: fixed;
    bottom: 10px;
    width: 100%;
    text-align: center;
    color: white;
    font-size: 15px;
    opacity: 0.8;
    transition: opacity 0.3s ease;
    z-index: 1500;
}

#soloLabel.visible {
    opacity: 0.8;
}
</style>
</head>

<body>

<div id="instructionsToggle">Show instructions</div>
<div id="accessibilityToggle">Accessible mode: OFF</div>

<div id="centerContent">
    <img src="../assets/images/karneval_qr.png" />
</div>

<div id="soloZone"></div>
<div id="soloLabel">Tap the bottom of your screen for SOLO MODE</div>

<script>
const COLORS = [
    "#f30dff",
    "#ffff26",
    "#ff3b3b",
    "#fab1df",
];

const SOLO_COLORS = [
    "#ff3014",
    "#faeb61",
    "#66f224",
    "#24f2e1",
    "#a562fc",
    "#fc62e3",
    // "#ff9966",
    // "#66aaff"
];

const NORMAL_DURATION = 3000;
const SOLO_DURATION = 400;

let solo = false;
let accessibility = false;
let instructionsVisible = false;

const soloZone = document.getElementById("soloZone");
const accessibilityToggle = document.getElementById("accessibilityToggle");
const instructionsToggle = document.getElementById("instructionsToggle");
const centerContent = document.getElementById("centerContent");
const soloLabel = document.getElementById("soloLabel");

instructionsToggle.addEventListener("click", () => {
    instructionsVisible = !instructionsVisible;
    centerContent.classList.toggle("visible", instructionsVisible);

    instructionsToggle.textContent =
        instructionsVisible ? "Hide instructions" : "Show instructions";
});

accessibilityToggle.addEventListener("click", () => {
    accessibility = !accessibility;

    accessibilityToggle.textContent =
        accessibility ? "Accessible mode: ON" : "Accessible mode: OFF";

    soloZone.classList.toggle("visible", accessibility);
    soloLabel.classList.toggle("visible", accessibility);
});

soloZone.addEventListener("click", () => {
    solo = !solo;
});

function hexToRgb(hex) {
    return {
        r: parseInt(hex.slice(1, 3), 16),
        g: parseInt(hex.slice(3, 5), 16),
        b: parseInt(hex.slice(5, 7), 16)
    };
}

function lerp(a, b, t) {
    return a + (b - a) * t;
}

function interpolateColor(c1, c2, t) {
    return {
        r: Math.round(lerp(c1.r, c2.r, t)),
        g: Math.round(lerp(c1.g, c2.g, t)),
        b: Math.round(lerp(c1.b, c2.b, t))
    };
}

function rgbString(c) {
    return `rgb(${c.r}, ${c.g}, ${c.b})`;
}

/* lower contrast for accessibility */
function soften(c) {
    if (!accessibility) return c;
    const factor = 0.8;
    const add = -20;

    return {
        r: Math.round(c.r * factor + add),
        g: Math.round(c.g * factor + add),
        b: Math.round(c.b * factor + add)
    };
}

function animate() {
    const palette = (solo ? SOLO_COLORS : COLORS).map(hexToRgb);
    const duration = solo ? SOLO_DURATION : NORMAL_DURATION;

    const now = Date.now();
    const phase = now / duration;

    const i = Math.floor(phase) % palette.length;
    const j = (i + 1) % palette.length;

    const t = phase % 1;

    let base = interpolateColor(palette[i], palette[j], t);
    base = soften(base);

    const light = {
        r: Math.min(255, base.r + 30),
        g: Math.min(255, base.g + 30),
        b: Math.min(255, base.b + 30)
    };

    const dark = {
        r: Math.max(0, base.r - 60),
        g: Math.max(0, base.g - 60),
        b: Math.max(0, base.b - 60)
    };

    document.body.style.background =
        `linear-gradient(135deg, ${rgbString(light)}, ${rgbString(dark)})`;

    requestAnimationFrame(animate);
}

animate();
</script>

</body>
</html>
